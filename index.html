<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poiret+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #49b0b9;

        }
        textarea {
            width: 500px;
            height: 50px;
            resize: none;
            border-radius: 10px;
            border: none;
            padding: 10px;
            font-size: 16px;
        }
        h1 {
            position: relative;
            bottom: 100px;
            font-family: 'Poiret One', cursive;
            color: white;
            font-weight: bolder;
        }
         div {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
         }
         .btn {
            width: 100px;
            height: 40px;
    
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Open Sans', sans-serif;
            font-weight: 600;
            cursor: pointer;
            color: white;
         }
         .dabba {
            display: flex;
            flex-direction: row;
            margin: 10px;
            gap: 20px;
            justify-content: space-around;
         }
            .copy {
                background-color: #3a86ff;
            }
            .paste {
                background-color: #8338ec;
            }
            .btn:hover {
             
                transform: scale(1.04);
                transition-duration: 0.3s;
            }
            .status-box {
            width: 300px;
            height: 40px;
            margin-top: 20px;
            background-color: rgba(255, 255, 255, 0.25); /* Semi-transparent box */
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            
            font-family: 'Open Sans', sans-serif;
            color: white;
            font-weight: bold;
            font-size: 14px;
            
           display:  none;
        
        }
    </style>
</head>
<body>
    <div class="status-box"></div>
<div>
    <h1>Copy and paster</h1>
    <textarea name="alpha" id="beta" placeholder="Enter your copyable message here..."></textarea>
</div>

<div class="dabba
">
<div class="copy btn">
copy
</div>
<div class="paste btn">
paste
</div>



</div>
















    <script src="index.js"></script>
</body>
</html>
